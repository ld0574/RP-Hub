# RP-Hub 一体化开发编排：API + PostgreSQL + Qdrant
services:
  postgres:
    image: postgres:16
    container_name: rphub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rphub
      POSTGRES_USER: rphub
      POSTGRES_PASSWORD: rphub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rphub-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rphub-api
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
    environment:
      DATABASE_URL: postgresql+psycopg2://rphub:rphub@postgres:5432/rphub
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rp_hub_memories
      EMBEDDING_DIM: 1536
      CORS_ORIGINS: "*"
      APP_ENV: development
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  qdrant_data:
